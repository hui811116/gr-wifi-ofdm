id: wifi_ofdm_ppdu_sink
label: ppdu_sink
category: '[wifi_ofdm]'

templates:
  imports: from gnuradio import wifi_ofdm
  make: wifi_ofdm.ppdu_sink()

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
